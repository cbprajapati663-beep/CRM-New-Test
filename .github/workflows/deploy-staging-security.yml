name: Deploy CRM Staging Security

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-staging:
    name: Deploy staging Firebase Functions and rules
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Enforce security branch
        run: test "$GITHUB_REF_NAME" = "security/auth-implementation-gate-20261003"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install root dependencies
        run: npm install --no-audit --no-fund
      - name: Install Functions dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund
      - name: Validate trusted Functions
        run: |
          node --check functions/lib/planLimits.js
          node --check functions/index.js
          node --test tests/staging/plan-enforcement-engine.test.cjs
      - name: Authenticate to staging Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT_STAGING: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_STAGING"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_STAGING" > "$RUNNER_TEMP/firebase-service-account.json"
          node -e "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/firebase-service-account.json','utf8'));"
      - name: Verify staging deployment target
        run: |
          test "heritage-crm-staging" = "heritage-crm-staging"
          ! grep -R "heritage-crm-f179a" -n functions firebase/staging .github/workflows/deploy-staging-security.yml
      - name: Deploy staging Functions and authorization rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          npx firebase-tools deploy --project heritage-crm-staging --only functions,firestore:rules,storage --non-interactive
      - name: Remove staging credential
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
