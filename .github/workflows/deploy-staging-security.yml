name: Deploy CRM Staging Security
# Explicit [deploy-staging] trigger is required for a branch-only staging deployment.
# Retry after target-guard path-filter fix.

on:
  workflow_dispatch:
  push:
    branches:
      - security/auth-implementation-gate-20261003
    paths:
      - .github/workflows/deploy-staging-security.yml

permissions:
  contents: read

jobs:
  deploy-staging:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy-staging]') }}
    name: Deploy staging Firebase Functions and rules
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Enforce security branch
        run: test "$GITHUB_REF_NAME" = "security/auth-implementation-gate-20261003"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install root dependencies
        run: npm install --no-audit --no-fund
      - name: Install Functions dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund
      - name: Validate trusted Functions
        run: |
          node --check functions/lib/planLimits.js
          node --check functions/index.js
          node --test tests/staging/plan-enforcement-engine.test.cjs
      - name: Authenticate to staging Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT_STAGING: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_STAGING"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_STAGING" > "$RUNNER_TEMP/firebase-service-account.json"
          node -e "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/firebase-service-account.json','utf8'));"
      - name: Verify deployment service account identity
        run: |
          node -e "const x=require(process.env.RUNNER_TEMP + '/firebase-service-account.json'); if (!x.client_email) process.exit(1); console.log('Deployment service account:', x.client_email);"
      - name: Verify staging deployment target
        run: |
          test "heritage-crm-staging" = "heritage-crm-staging"
          ! git grep -n "heritage-crm-f179a" -- functions firebase/staging ':!**/*.md'
      - name: Deploy staging Functions and authorization rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          npx firebase-tools deploy --project heritage-crm-staging --only functions,firestore:rules,storage --non-interactive --force
      - name: Remove staging credential
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
