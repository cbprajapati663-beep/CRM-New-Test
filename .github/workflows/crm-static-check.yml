name: CRM Static Checks

on:
  push:
    branches:
      - main
      - fix/crm-audit-navigation-20261010
  pull_request:
    branches:
      - main

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate JavaScript syntax
        run: node --check assets/js/app.js
      - name: Check navigation markup and cache version
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const html = fs.readFileSync('index.html', 'utf8');
          const js = fs.readFileSync('assets/js/app.js', 'utf8');
          const required = [
            'tabPipeline', 'tabRejected', 'tabDisbursed', 'tabDealers',
            'tabSecretPayouts', 'tabFollowups', 'tabDataHealth', 'tabWorkflow',
            'view-pipeline', 'view-disbursedhub', 'view-dealers',
            'view-payoutdesk', 'view-followups', 'view-datahealth', 'view-workflow',
            'clientPipelineTablePanel', 'leadsTableBody'
          ];
          for (const id of required) {
            assert.ok(html.includes('id="' + id + '"') || html.includes("id='" + id + "'"), 'Missing HTML element: ' + id);
          }
          assert.match(html, /assets\/js\/app\.js\?v=[^"'\s]+/, 'app.js cache-busting version is missing');
          assert.ok(js.includes('return Array.isArray(defaults[permission]) && defaults[permission].includes(role);'), 'Default staff permissions must be restricted to the current role');
          assert.ok(js.includes("id === 'view-pipeline' && !!document.getElementById('tabRejected')?.classList.contains('active')"), 'Pipeline visibility does not account for Rejected tab');
          assert.match(js, /Pipeline render skipped: #leadsTableBody is not present in the DOM/);
          assert.ok(js.includes('window.exportToCSV = function()'), 'Export button handler is missing');
          assert.ok(js.includes('window.installPWA = async function ()'), 'Install App button handler is missing');
          assert.ok(js.includes("'Leads · View': ['Administrator','Manager','Branch Manager','Sales Executive','Viewer'].includes(role)"), 'Branch Manager default lead-view permission is missing');
          assert.ok(js.includes("'Leads · Create/Edit': ['Administrator','Manager','Branch Manager','Sales Executive'].includes(role)"), 'Branch Manager default lead-edit permission is missing');
          assert.ok(js.includes('if(leadTenantId) return leadTenantId===tenantId;'), 'Viewer reports must prioritize explicit tenant ownership');
          assert.ok(js.includes("staffAccountsCollection.where('staffId','==',staff.id).limit(2).get()"), 'Staff edit lookup must support legacy account documents linked by staffId');
          assert.ok(js.includes("String(account.staffId||'')!==String(managementEditingStaffId||'')"), 'Duplicate login check must not reject the current legacy staff account');
          assert.ok(js.includes("if(!staffAccountRef)staffAccountRef=staffAccountsCollection.doc(staffId);"), 'Staff edits must update an existing linked account before creating a canonical document');
          assert.ok(js.includes('staffAccountDocId: staffDoc.id'), 'Staff login must retain the actual account document ID for password changes');
          assert.ok(js.includes("staffAccountsCollection.where('staffId', '==', staffId).limit(2).get()"), 'Staff self-password change must support legacy linked accounts');
          assert.ok(js.includes("if(tenantKeys.has(leadCreatedBy)) return true;"), 'Viewer report legacy ownership check is missing');
          assert.ok(js.includes('const scoped = getLeadScopedList();'), 'Lead CSV export must use the signed-in user scope');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          assert.ok(manifest.name && manifest.start_url && manifest.icons && manifest.icons.length, 'PWA manifest is incomplete');
          assert.ok(html.includes('rel="manifest" href="manifest.json"'), 'PWA manifest link is missing');
          const ids = [...html.matchAll(/\bid=["']([^"']+)["']/g)].map(match => match[1]);
          assert.equal(new Set(ids).size, ids.length, 'Duplicate HTML IDs found');
          const handlers = [...new Set([...html.matchAll(/\bon(?:click|change|submit)\s*=\s*["']\s*([A-Za-z_$][\w$]*)\s*\(/g)].map(match => match[1]))];
          const declared = new Set([
            ...[...js.matchAll(/window\s*\.\s*([A-Za-z_$][\w$]*)\s*=/g)].map(match => match[1]),
            ...[...js.matchAll(/\bfunction\s+([A-Za-z_$][\w$]*)\s*\(/g)].map(match => match[1])
          ]);
          const missingHandlers = handlers.filter(name => !declared.has(name));
          assert.deepEqual(missingHandlers, [], 'Inline event handlers missing from app.js: ' + missingHandlers.join(', '));
          assert.ok(manifest.icons.some(icon => icon.src === 'assets/icons/heritage-app-icon.svg'), 'PWA app icon is missing from manifest');
          assert.ok(js.includes("if (typeof value !== 'number' && /^[\\s]*[=+@\\-]/.test(text))"), 'CSV export formula sanitization is missing');
          console.log('CRM static navigation and export checks passed.');
          NODE
