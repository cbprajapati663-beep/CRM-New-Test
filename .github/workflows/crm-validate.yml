name: CRM Validation

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required CRM structure
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const app = fs.readFileSync('assets/js/app.js', 'utf8');
          const requiredHtml = [
            'leadForm',
            'vehRegNo',
            'printableDOArea',
            'printableRentBillArea',
            'leadAuditModal',
            'leadActivityTimeline',
            'printSelectedDocument'
          ];
          const missingHtml = requiredHtml.filter(x => !html.includes(x));
          const requiredApp = ['generateDO'];
          const missingApp = requiredApp.filter(x => !app.includes(x));
          if (missingHtml.length || missingApp.length) {
            if (missingHtml.length) console.error('Missing required HTML markers:', missingHtml.join(', '));
            if (missingApp.length) console.error('Missing required app.js markers:', missingApp.join(', '));
            process.exit(1);
          }
          const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)]
            .map(m => m[1])
            .filter(x => x.trim());
          fs.writeFileSync('/tmp/crm-inline.js', scripts.join('\n'));
          console.log('HTML structure OK. Inline script blocks:', scripts.length);
          NODE

      - name: Syntax check inline JavaScript
        run: node --check /tmp/crm-inline.js

      - name: Syntax check application JavaScript
        run: node --check assets/js/app.js

      - name: Syntax check tenant login JavaScript
        run: node --check assets/js/login-page.js

      - name: Syntax check staging Firebase bootstrap
        run: node --check assets/js/staging/firebase-bootstrap.js

      - name: Syntax check staging Auth session bridge
        run: node --check assets/js/staging/auth-session.js

      - name: Syntax check staging config template
        run: node --check assets/js/staging/firebase-config.example.js

      - name: Run staging bootstrap guard tests
        run: node --test tests/staging/firebase-bootstrap.test.cjs

      - name: Run staging auth page isolation tests
        run: node --test tests/staging/auth-smoke-page.test.cjs

      - name: Run staging login isolation tests
        run: node --test tests/staging/staging-login-page.test.cjs

      - name: Run staging CRM isolation tests
        run: node --test tests/staging/staging-crm-page.test.cjs

      - name: Run staging config template guard tests
        run: node --test tests/staging/config-template.test.cjs

      - name: Run staging identity contract tests
        run: node --test tests/staging/identity-contract.test.cjs

      - name: Run staging Auth membership bridge tests
        run: node --test tests/staging/auth-session.test.cjs

      - name: Run staging authorization rules contract tests
        run: node --test tests/staging/rules-contract.test.cjs

      - name: Run staging identity fixture safety tests
        run: node --test tests/staging/identity-fixture.test.cjs

      - name: Run staging deployment gate tests
        run: node --test tests/staging/deployment-gate.test.cjs
      - name: Run server-side plan enforcement contract tests
        run: node --test tests/staging/plan-enforcement-contract.test.cjs

      - name: Syntax check trusted plan enforcement functions
        run: |
          node --check functions/lib/planLimits.js
          node --check functions/index.js

      - name: Run trusted plan enforcement engine tests
        run: node --test tests/staging/plan-enforcement-engine.test.cjs

      - name: Install staging security test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --prefer-offline --fetch-retries=2 --fetch-timeout=120000

      - name: Run Firestore emulator authorization tests
        run: npm run test:staging:firestore

      - name: Run Storage emulator authorization tests
        run: npm run test:staging:storage
